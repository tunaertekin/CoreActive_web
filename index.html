    <meta charset="UTF-8" />

    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script>
      // Token ve durum: polling ile Dart tarafindan okunur, callback/interop sorunu yok.
      window.__turnstileStore = {};

      window.__registerTurnstile = function (elementId, siteKey) {
        if (!window.turnstile) {
          return false;
        }
        var el = document.getElementById(elementId);
        if (!el) {
          return false;
        }
        // Onceki kaydı temizle.
        delete window.__turnstileStore[elementId];

        try {
          var doRender = function () {
            turnstile.render("#" + elementId, {
              sitekey: siteKey,
              callback: function (token) {
                window.__turnstileStore[elementId] = { token: token, error: false };
              },
              "error-callback": function (code) {
                console.error(
                  "Turnstile error", code,
                  "host=" + window.location.hostname
                );
                window.__turnstileStore[elementId] = { token: null, error: true, code: code };
              },
              "expired-callback": function () {
                delete window.__turnstileStore[elementId];
              },
            });
          };
          if (typeof turnstile.ready === "function") {
            turnstile.ready(doRender);
          } else {
            doRender();
          }
          return true;
        } catch (e) {
          console.error("turnstile.render failed", e);
          return false;
        }
      };

      window.__getTurnstileResult = function (elementId) {
        var r = window.__turnstileStore[elementId];
        if (!r) return null;
        if (r.error) return "ERROR";
        return r.token || null;
      };

      window.__clearTurnstileResult = function (elementId) {
        delete window.__turnstileStore[elementId];
      };
    </script>
    <script>
      // Flutter HashUrlStrategy / Navigator /app rotasını ezmeden önce kaydet.
      // Dart2JS `(window as dynamic).__coreactiveLaunchHref` adını minify eder
      // (canlı bundle'da window.gc4O()), bu yüzden attribute + sessionStorage da yazıyoruz.
      (function () {
        var href = window.location.href;
        window.__coreactiveLaunchHref = href;
        try {
          document.documentElement.setAttribute("data-launch-href", href);
          sessionStorage.setItem("__coreactiveLaunchHref", href);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      // Prevent stale Flutter web bundles from being served.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ("caches" in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
