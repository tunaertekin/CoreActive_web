    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script>
      window.__registerTurnstile = function (elementId, siteKey, callbackName) {
        if (!window.turnstile) {
          return false;
        }
        var el = document.getElementById(elementId);
        if (!el) {
          return false;
        }
        try {
          var renderWidget = function () {
            turnstile.render("#" + elementId, {
              sitekey: siteKey,
              callback: function (token) {
                if (typeof window[callbackName] === "function") {
                  window[callbackName](token);
                }
              },
              "error-callback": function (code) {
                console.error(
                  "Turnstile error",
                  code,
                  "host=" + window.location.hostname,
                  "sitekey=" + siteKey,
                );
                var errorName = callbackName + "_error";
                if (typeof window[errorName] === "function") {
                  window[errorName]();
                }
              },
              "expired-callback": function () {
                var expiredName = callbackName + "_expired";
                if (typeof window[expiredName] === "function") {
                  window[expiredName]();
                }
              },
            });
          };
          if (typeof turnstile.ready === "function") {
            turnstile.ready(renderWidget);
          } else {
            renderWidget();
          }
          return true;
        } catch (e) {
          console.error("turnstile.render failed", e);
          return false;
        }
      };
    </script>
  </head>
  <body>
    <script>
      // Prevent stale Flutter web bundles from being served.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ("caches" in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
